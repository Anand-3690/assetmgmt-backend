<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Label - {{ asset.asset_tag }}</title>
<style>
  body { font-family: sans-serif; text-align: center; }
  .label { display: inline-block; border: 1px solid #000; padding: 12px; margin: 20px; }
  img { display: block; margin: 0 auto; }
  .tag { font-weight: bold; margin-top: 6px; }
  .name { font-size: 0.85rem; color: #333; }
</style>
</head>
<body>
  <div class="label">
    <img src="{% url 'asset_qr' asset.asset_tag %}" width="150" height="150">
    <div class="tag">{{ asset.asset_tag }}</div>
    <div class="name">{{ asset.name }}</div>
  </div>
</body>
</html>
